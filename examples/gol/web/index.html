<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game of Life</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <p class="head">Game of Life</p>
    <p class="desc">Click cells to toggle them, then step through generations</p>

    <div class="cont">
      <canvas id="grid" width="864" height="486"></canvas>
      <div class="controls">
        <button id="step">Step</button>
        <button id="run">Run</button>
        <button id="clear">Clear</button>
      </div>
    </div>
  </main>

  <script src="index.js?v=1"></script>
</body>
</html>
